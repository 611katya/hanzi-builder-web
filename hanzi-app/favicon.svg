  <!-- Whiskers -->
  <path d="M78 172 L40 166 M78 180 L38 180" stroke="#FBF9EF" stroke-width="3" stroke-linecap="round"/>
  <path d="M222 172 L260 166 M222 180 L262 180" stroke="#FBF9EF" stroke-width="3" stroke-linecap="round"/>
</svg>
