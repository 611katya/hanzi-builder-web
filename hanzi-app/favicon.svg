<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background square -->
  <rect x="0" y="0" width="300" height="300" rx="36" fill="#54697A"/>

  <!-- Ears -->
  <path d="M95 105 Q80 45 95 33 Q125 58 140 88" fill="none" stroke="#FBF9EF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M208 100 Q228 48 216 35 Q182 62 165 90" fill="none" stroke="#FBF9EF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="150" cy="160" r="80" fill="none" stroke="#FBF9EF" stroke-width="6"/>

  <!-- Eyes: one winking, one open -->
  <path d="M112 152 Q124 140 136 152" fill="none" stroke="#FBF9EF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="176" cy="150" r="7" fill="#FBF9EF"/>

  <!-- Nose -->
  <path d="M145 175 Q150 180 155 175" fill="none" stroke="#FBF9EF" stroke-width="4" stroke-linecap="round"/>

  <!-- Mouth: open, playful -->
