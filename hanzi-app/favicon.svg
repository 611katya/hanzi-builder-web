<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ears: one tilted for playfulness -->
  <path d="M95 105 Q80 45 95 33 Q125 58 140 88" fill="none" stroke="#54697A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M208 100 Q228 48 216 35 Q182 62 165 90" fill="none" stroke="#54697A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="150" cy="160" r="80" fill="none" stroke="#54697A" stroke-width="6"/>

  <!-- Eyes: one winking (curve), one open (small circle) -->
  <path d="M112 152 Q124 140 136 152" fill="none" stroke="#54697A" stroke-width="5" stroke-linecap="round"/>
  <circle cx="176" cy="150" r="7" fill="#54697A"/>

  <!-- Nose -->
  <path d="M145 175 Q150 180 155 175" fill="none" stroke="#54697A" stroke-width="4" stroke-linecap="round"/>

  <!-- Mouth: open, playful "mew" -->
  <ellipse cx="150" cy="190" rx="8" ry="10" fill="none" stroke="#54697A" stroke-width="4"/>

  <!-- Whiskers -->
  <path d="M78 172 L40 166 M78 180 L38 180" stroke="#54697A" stroke-width="3" stroke-linecap="round"/>
  <path d="M222 172 L260 166 M222 180 L262 180" stroke="#54697A" stroke-width="3" stroke-linecap="round"/>
</svg>
